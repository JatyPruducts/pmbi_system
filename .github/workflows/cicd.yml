name: PMBI CI/CD

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  DOCKER_REPO: jatystudio/pmbi_system
  DEPLOY_PATH: /home/pmbi

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:api-latest
            ${{ env.DOCKER_REPO }}:api-${{ github.sha }}

      - name: Build and push WEB image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/nginx/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:web-latest
            ${{ env.DOCKER_REPO }}:web-${{ github.sha }}

  deploy:
    name: Deploy on Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_LOGIN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH,DOCKERHUB_LOGIN,DOCKERHUB_TOKEN
          script: |
            set -e
            cd "$DEPLOY_PATH"

            docker login -u "$DOCKERHUB_LOGIN" -p "$DOCKERHUB_TOKEN"
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans

            docker image prune -af
            docker container prune -f
